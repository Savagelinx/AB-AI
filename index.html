<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d18">
  <meta name="description" content="AB AI — your personal AI assistant">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>AB AI</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="orb">✦</div><div><strong>AB AI</strong><small>Your personal assistant</small></div></div>
      <button class="icon-btn" id="clearBtn" aria-label="New chat" title="New chat">＋</button>
    </header>
    <section class="welcome" id="welcome">
      <div class="hero-orb">✦</div>
      <p class="eyebrow">YOUR PERSONAL AI</p>
      <h1>What can I help<br>you with today?</h1>
      <p class="muted">Ask a question, plan something, or work through an idea.</p>
      <div class="suggestions">
        <button class="suggestion">Help me plan my week</button>
        <button class="suggestion">Explain something simply</button>
        <button class="suggestion">Give me project ideas</button>
      </div>
    </section>
    <section class="messages" id="messages" aria-live="polite"></section>
    <div class="notice" id="notice">Starter version: chat interface is ready. We’ll connect a free AI model in the next step.</div>
    <form class="composer" id="chatForm">
      <textarea id="prompt" rows="1" placeholder="Message AB AI..." aria-label="Message AB AI"></textarea>
      <button class="send" type="submit" aria-label="Send message">↑</button>
    </form>
    <footer>AB AI · Personal assistant</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
